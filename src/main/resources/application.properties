server.port=8080
vaadin.launch-browser=false

# The model loaded at startup, run in this JVM by Quixotic jinfer. The UI can switch between
# the small models listed in ModelService.OPTIONS; a Hugging Face "owner/repo:QUANT" reference
# or a .gguf path set here is added to that list. Override with env var AGENT_MODEL.
agent.model=LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q4_K_M
agent.context-capacity=8192
agent.max-output-tokens=1024

# An OpenAI-compatible API (OpenAI, x.ai, a llama.cpp server, ...). When an API key is set, its
# models join the Model selector: the ones listed in agent.api.models (comma-separated), or, if
# that is empty, every model the API lists at GET /models.
# Override with env vars OPENAI_API_KEY, OPENAI_BASE_URL and OPENAI_MODELS.
agent.api.key=${OPENAI_API_KEY:}
agent.api.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
agent.api.models=${OPENAI_MODELS:}
